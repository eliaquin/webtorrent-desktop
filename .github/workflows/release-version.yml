name: Prepare patch release
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'static/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release*.yml'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-patch-release
  cancel-in-progress: false
jobs:
  validate:
    # Build-only deliveries still run CI, but do not publish a GitHub release.
    if: github.repository == 'eliaquin/webtorrent-desktop' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]'))
    uses: ./.github/workflows/ci.yml
  version:
    needs: validate
    if: github.repository == 'eliaquin/webtorrent-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Increment patch version and start release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/release-automation.js bump
